name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec publint

      # A run that pushed its version bump but failed to publish leaves main a version ahead of npm.
      # Publish that version as-is instead of generating changesets and bumping a second time.
      - name: Check for unpublished version
        id: pending
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if OUT=$(npm view "@colordx/core@${VERSION}" version 2>&1); then
            echo "${VERSION} is already on npm"
          elif grep -q E404 <<<"$OUT"; then
            echo "${VERSION} is not on npm yet, publishing it without a new bump"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "$OUT"
            exit 1
          fi

      - name: Find last release ref
        id: last
        if: steps.pending.outputs.version == ''
        run: |
          TAG=$(git describe --tags --abbrev=0 --match '@colordx/core@*' 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            TAG=$(git rev-list --max-parents=0 HEAD | head -1)
          fi
          echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          echo "Diffing against: $TAG"

      - name: Generate changesets from commits
        if: steps.pending.outputs.version == ''
        env:
          BUMP: ${{ inputs.bump }}
          BASE_REF: ${{ steps.last.outputs.ref }}
        run: pnpm exec tsx scripts/changeset.ts

      - name: Version packages
        if: steps.pending.outputs.version == ''
        run: pnpm exec changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push version bump
        if: steps.pending.outputs.version == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md .changeset
          git diff --staged --quiet || (git commit -m "chore: release" && git push)

      # npm, not `changeset publish`: in a pnpm repo changesets hands off to `pnpm publish`, and it
      # rejects --provenance since 2.31. npm is the path proven with trusted publishing and provenance.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@colordx/core@${VERSION}" version >/dev/null 2>&1; then
            echo "${VERSION} is already on npm, nothing to publish"
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="@colordx/core@${VERSION}"
          NOTES=$(VERSION="$VERSION" node -e '
            const fs = require("fs");
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
            const version = process.env.VERSION;
            const match = changelog.match(new RegExp("## " + version.replace(/\./g, "\\.") + "\\n([\\s\\S]*?)(?=\\n## |$)"));
            process.stdout.write(match ? match[1].trim() : "");
          ')
          gh release create "${TAG}" \
            --title "v${VERSION}" \
            --notes "${NOTES}" \
            2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
