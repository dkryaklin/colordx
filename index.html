<title>colordx vs tinycolor2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #f6f4fa; --surface: #ffffff; --track: #e7e3f0;
    --line: #ded9ea; --ink: #191527; --muted: #756d8b;
    --violet: #6a3fd9; --gold: #f0b400; --slate: #a3aabd;
    color-scheme: light;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #121019; --surface: #1b1826; --track: #2a2638;
      --line: #2f2b40; --ink: #f1eef8; --muted: #948ca9;
      --violet: #a585f5; --gold: #ffc200; --slate: #5c6379;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121019; --surface: #1b1826; --track: #2a2638;
    --line: #2f2b40; --ink: #f1eef8; --muted: #948ca9;
    --violet: #a585f5; --gold: #ffc200; --slate: #5c6379;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Archivo, ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 30px 20px 48px; display: flex; flex-direction: column; gap: 22px; }

  .dials { display: grid; grid-template-columns: 1fr; gap: 16px 34px; }
  @media (min-width: 700px) { .dials { grid-template-columns: repeat(3, 1fr); } }
  .dial { display: flex; flex-direction: column; gap: 5px; }
  .dial .top { display: flex; justify-content: space-between; align-items: baseline; }
  .dial .name { font-size: 13px; font-weight: 600; letter-spacing: .01em; }
  .dial .val {
    font-family: "DM Mono", ui-monospace, Menlo, monospace;
    font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted);
  }
  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; margin: 0; cursor: grab;
  }
  input[type="range"]:active { cursor: grabbing; }
  input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--track); }
  input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--track); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 16px; height: 16px; margin-top: -6px;
    border-radius: 50%; background: var(--violet); border: 2px solid var(--surface);
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%; background: var(--violet); border: 2px solid var(--surface);
  }
  :focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }

  .pair { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 720px) { .pair { grid-template-columns: 1fr 1fr; } }
  .side { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .bar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .who { font-size: 15px; font-weight: 600; display: flex; align-items: baseline; gap: 7px; }
  .who .pip { width: 9px; height: 9px; border-radius: 50%; }
  .pip.tc { background: var(--slate); }
  .pip.dx { background: var(--gold); }
  .ms {
    font-family: "DM Mono", ui-monospace, Menlo, monospace;
    font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink);
  }
  .frame { position: relative; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: var(--track); }
  .frame canvas { display: block; width: 100%; height: auto; }
  .sweep {
    position: absolute; left: 0; right: 0; height: 2px; background: var(--violet);
    box-shadow: 0 0 9px 1px var(--violet); pointer-events: none;
  }
  .sweep[hidden] { display: none; }

  .verdict {
    display: flex; align-items: baseline; justify-content: center; gap: 10px;
    font-family: "DM Mono", ui-monospace, Menlo, monospace;
    font-size: clamp(28px, 5vw, 40px); color: var(--violet);
    font-variant-numeric: tabular-nums; letter-spacing: -.03em;
  }
  .verdict .tail { font-family: Archivo, sans-serif; font-size: 15px; color: var(--muted); letter-spacing: 0; }
</style>

<div class="wrap">
  <div class="dials">
    <div class="dial">
      <div class="top"><span class="name">Lightness</span><span class="val" id="v-l">0</span></div>
      <input type="range" id="s-l" min="-100" max="100" step="1" value="0" aria-label="Lightness">
    </div>
    <div class="dial">
      <div class="top"><span class="name">Saturation</span><span class="val" id="v-s">0</span></div>
      <input type="range" id="s-s" min="-100" max="100" step="1" value="0" aria-label="Saturation">
    </div>
    <div class="dial">
      <div class="top"><span class="name">Hue</span><span class="val" id="v-h">0&deg;</span></div>
      <input type="range" id="s-h" min="-180" max="180" step="1" value="0" aria-label="Hue">
    </div>
  </div>

  <div class="pair">
    <div class="side">
      <div class="bar">
        <span class="who"><span class="pip tc"></span>tinycolor2</span>
        <span class="ms" id="t-tc">0 ms</span>
      </div>
      <div class="frame"><canvas id="c-tc"></canvas><div class="sweep" id="w-tc" hidden></div></div>
    </div>
    <div class="side">
      <div class="bar">
        <span class="who"><span class="pip dx"></span>colordx</span>
        <span class="ms" id="t-dx">0 ms</span>
      </div>
      <div class="frame"><canvas id="c-dx"></canvas><div class="sweep" id="w-dx" hidden></div></div>
    </div>
  </div>

  <div class="verdict"><span id="mult">&mdash;</span><span class="tail">faster</span></div>
</div>
